name: Build & Package Web Lab

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  package-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML files
        run: |
          ls -la
          ls -la *.html || true

      - name: Create release zip bundle
        run: |
          mkdir -p dist
          zip -r dist/web-lab-bundle.zip *.html -x ".git/*" ".github/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-lab-package
          path: dist/web-lab-bundle.zip
